name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kyrex.jks"
            keytool -list -keystore "$RUNNER_TEMP/kyrex.jks" -storepass "$KS_PASSWORD" | grep -i "entry"
            echo "KS_PATH=$RUNNER_TEMP/kyrex.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key set - using default debug key"
          fi
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kyrex-apk
          path: app/build/outputs/apk/debug/app-debug.apk
